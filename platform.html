<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Platform profile, official links, trading fees and regional eligibility information."><meta name="theme-color" content="#08111f"><title>Platform profile · AUTOMATET</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--line:#263a55;--text:#edf5ff;--muted:#9db0c9;--mint:#50e5d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#18314b 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(100% - 36px,1000px);margin:auto}.nav{padding:20px 0;border-bottom:1px solid var(--line)}a{color:var(--mint);text-decoration:none}.brand{font-weight:900;letter-spacing:2px;color:var(--text)}main{padding:48px 0}.eyebrow{color:var(--mint);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero{padding:30px 0}.hero h1{font-size:clamp(34px,7vw,58px);line-height:1.05;letter-spacing:-2px;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:linear-gradient(145deg,#13243a,#0d1727);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 14px}.metric{font-size:24px;font-weight:900}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted);margin:3px}.btn{display:inline-block;padding:11px 15px;background:linear-gradient(110deg,#50e5d0,#9cf0d7);border-radius:10px;color:#07131b;font-weight:900;margin:8px 8px 0 0}.status{color:var(--muted);padding:25px 0}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 26px,1000px)}main{padding:30px 0}}
</style></head><body><header class="nav"><div class="wrap"><a class="brand" href="/"><span style="display:inline-flex;vertical-align:middle;margin-right:8px"><svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="30" height="30" fill="none" aria-hidden="true"><defs><linearGradient id="aBlue" x1="10" y1="54" x2="48" y2="5" gradientUnits="userSpaceOnUse"><stop stop-color="#087DFF"/><stop offset=".52" stop-color="#08BCEB"/><stop offset="1" stop-color="#8AF5FF"/></linearGradient><linearGradient id="aEdge" x1="15" y1="56" x2="49" y2="10" gradientUnits="userSpaceOnUse"><stop stop-color="#073BBA"/><stop offset="1" stop-color="#22E8FF"/></linearGradient></defs><path d="M7 55 29.7 8.5c1.1-2.2 4.2-2.2 5.3 0L57 55H43.5L32.4 31.8 21.2 55H7Z" fill="url(#aBlue)" stroke="url(#aEdge)" stroke-width="1.5" stroke-linejoin="round"/><path d="m20.2 43.2 28.6-15.5 3.4 6.1-28.7 15.4-3.3-6Z" fill="#07152D" stroke="#21DDF7" stroke-width="1.2" stroke-linejoin="round"/><path d="m27.3 40.1 22-11.9 2.9 5.2-21.9 11.8-3-5.1Z" fill="#13C9F2"/><g stroke="#8AF5FF" stroke-width="1.8" stroke-linecap="round"><path d="M48.8 22V12"/><path d="M55 19V7"/><path d="M60 23V14"/></g><g fill="#15D9EE"><rect x="47" y="17" width="3.7" height="9" rx=".7"/><rect x="53.2" y="12" width="3.7" height="13" rx=".7"/><rect x="58.2" y="18" width="3.7" height="8" rx=".7"/></g></svg></span>AUTOMATET</a><span style="float:right"><a href="/compare.html">Compare platforms</a></span></div></header>
<main class="wrap"><div id="profile" class="status">Loading verified platform profile…</div></main>
<footer><div class="wrap">AUTOMATET provides informational content only. Fees, services and regional eligibility can change. Always confirm terms with the official provider.</div></footer>
<script>
const host=document.getElementById("profile");
const esc=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fee=(v)=>v===null||v===undefined?"Not yet verified":esc(v)+"%";
async function init(){
 const slug=new URLSearchParams(location.search).get("slug");
 if(!slug||!/^[a-z0-9-]+$/i.test(slug)){host.textContent="Choose a valid platform from the directory.";return;}
 try{
  const res=await fetch("/api/platforms/"+encodeURIComponent(slug));const body=await res.json();
  if(!res.ok)throw new Error(body.error||"Platform not found");
  const p=body.data,regions=Array.isArray(p.regional_availability)?p.regional_availability:[];
  const regionLabels={available:"Confirmed available",restricted:"Restrictions reported",unavailable:"Confirmed unavailable",unknown:"Not yet verified"};
  const countryName=(code)=>{try{return code?new Intl.DisplayNames([navigator.language||"en"],{type:"region"}).of(code):"";}catch{return code||"";}};
  const visitorCountry=countryName(p.visitor_country_code);
  const regionalContent=visitorCountry
    ? (regions.length?regions.map(region=>'<div style="padding:10px 0;border-bottom:1px solid #263752"><strong>'+esc(visitorCountry)+'</strong><div class="metric">'+esc(regionLabels[region.status]||"Not yet verified")+'</div><p class="muted">'+esc(region.notes||"No additional regional notes.")+'</p>'+(region.evidence_url?'<a href="'+esc(region.evidence_url)+'" target="_blank" rel="noopener noreferrer">Official evidence ↗</a>':"")+(region.checked_at?'<p class="muted">Last checked: '+esc(new Date(region.checked_at).toLocaleDateString())+'</p>':"")+'</div>').join("")
      :'<p class="muted">Regional availability for '+esc(visitorCountry)+' has not yet been verified. We do not infer availability from missing restrictions.</p>')
    :'<p class="muted">Your country could not be determined for this visit. Regional availability is not displayed.</p>';
  const cats=Array.isArray(p.categories)?p.categories.map(c=>'<span class="pill">'+esc(c.name)+'</span>').join(""):"";
  host.innerHTML='<div class="eyebrow">'+esc(p.platform_type)+' · PLATFORM PROFILE</div><div class="hero"><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.description||"Official platform profile. Some details are awaiting verification.")+'</p><a class="btn" href="'+esc(p.website_url)+'" target="_blank" rel="noopener noreferrer">Official website ↗</a><a class="btn" href="/compare.html">Compare platforms</a></div><div class="grid"><section class="panel"><h2>Trading fees</h2><div class="muted">'+esc((p.fee_product_scope||"Product not verified")+" · "+(p.fee_tier||"Tier not verified"))+'</div><div class="muted">Maker</div><div class="metric">'+fee(p.trading_fee_maker)+'</div><div class="muted" style="margin-top:10px">Taker</div><div class="metric">'+fee(p.trading_fee_taker)+'</div><p class="muted">Rates apply to the recorded product and tier only; pair, region, VIP and promotion conditions may change them.</p>'+(p.fee_source_url?'<a href="'+esc(p.fee_source_url)+'" target="_blank" rel="noopener noreferrer">Official fee source ↗</a>':'<span class="muted">No official fee source recorded yet.</span>')+(p.fee_checked_at?'<p class="muted">Last checked: '+esc(new Date(p.fee_checked_at).toLocaleDateString())+'</p>':"")+'</section><section class="panel"><h2>Regional availability'+(visitorCountry?' · '+esc(visitorCountry):'')+'</h2>'+regionalContent+'</section></div><section class="panel"><h2>Categories</h2>'+(cats||'<span class="muted">No categories verified yet.</span>')+'</section><section class="panel"><h2>Verified promotions</h2><div class="metric">'+esc(p.active_promotions)+'</div><p class="muted">Currently active verified offers published on AUTOMATET.</p></section>';
  document.title=p.name+" · AUTOMATET";
 }catch(e){host.textContent=e.message;}
}
init();
</script></body></html>
