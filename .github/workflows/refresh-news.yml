name: Refresh AUTOMATET crypto news

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh RSS feeds and verify the news API
        env:
          NEWS_API_URL: https://automatet-crypto-deals.pages.dev/api/news
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$NEWS_API_URL")
          echo "$response" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              if (!Array.isArray(payload.data)) throw new Error("News API did not return a data array");
              console.log("Published stories:", payload.data.length);
              console.log("Refresh timestamp:", payload.refreshed_at || "not supplied");
              console.log("Newest headline:", payload.data[0]?.headline || "none");
            });
          '
