name: Deploy AUTOMATET Crypto Deals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatet-crypto-deals-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency security audit
        continue-on-error: true
        shell: bash
        run: |
          audit_status=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          echo "npm audit exit status: $audit_status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/npm-audit.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            console.log('AUDIT_REPORT_UNAVAILABLE: npm did not return valid JSON.');
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities;
          if (counts) {
            console.log('VULNERABILITY_COUNTS ' + JSON.stringify(counts));
          }
          const entries = Object.entries(report.vulnerabilities ?? {});
          if (!entries.length) {
            console.log('NO_DEPENDENCY_VULNERABILITIES_REPORTED');
          }
          for (const [name, item] of entries) {
            console.log('PACKAGE ' + JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable ?? false
            }));
          }
          NODE
      - name: Validate API and smoke-test syntax
        run: npm run check
      - name: Verify local Wrangler version
        run: npx wrangler --version
      - name: Create isolated preview Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project list | grep -q "automatet-crypto-deals"; then
            npx wrangler pages project create automatet-crypto-deals --production-branch main
          fi
      - name: Deploy to isolated preview project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --project-name automatet-crypto-deals --branch main --commit-dirty=true
      - name: Read-only preflight for automatet.com
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          api="https://api.cloudflare.com/client/v4"
          for project in automatet automatet-crypto-deals; do
            echo "Pages custom domains for project: $project"
            result=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains")
            echo "$result" | jq -r 'if .success then (.result[]? | "DOMAIN " + .name + " STATUS " + (.status // "unknown")) else "READ_FAILED " + ((.errors[0].message // "unknown error")) end' 2>/dev/null || echo "READ_FAILED: response could not be parsed"
          done
          echo "Zone and apex DNS preflight: automatet.com"
          zones=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/zones?name=automatet.com")
          zone_id=$(echo "$zones" | jq -r 'if .success then (.result[0].id // empty) else empty end' 2>/dev/null)
          if [ -n "$zone_id" ]; then
            echo "ZONE_READ_OK"
            dns=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/zones/$zone_id/dns_records?name=automatet.com")
            echo "$dns" | jq -r 'if .success then (.result[]? | "DNS " + .type + " " + .name + " -> " + .content + " PROXIED " + (.proxied|tostring)) else "DNS_READ_FAILED " + ((.errors[0].message // "unknown error")) end' 2>/dev/null || echo "DNS_READ_FAILED: response could not be parsed"
          else
            echo "ZONE_READ_FAILED: token may not have Zone Read permission"
          fi
      - name: Verify preview website, public APIs and admin protection
        env:
          SMOKE_BASE_URL: https://automatet-crypto-deals.pages.dev
        run: npm run smoke
      - name: Confirm existing production Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project list | grep -q "automatet" || {
            echo "Production Pages project automatet was not found; refusing public deployment."
            exit 1
          }
      - name: Publish validated build to automatet.com Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --project-name automatet --branch main --commit-dirty=true
      - name: Verify live automatet.com website and APIs
        env:
          SMOKE_BASE_URL: https://automatet.com
        run: npm run smoke
      - name: Notify IndexNow search engines about sitemap URLs
        if: success()
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urlList = [...xml.matchAll(/<loc>(https:\/\/automatet\.com\/[^<]+)<\/loc>/g)].map(([, url]) => url);
          if (!urlList.length) throw new Error('No AUTOMATET URLs found in sitemap.xml');
          const key = '41f1038dc07e821730199baf63951f8e';
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'content-type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: 'automatet.com',
              key,
              keyLocation: `https://automatet.com/${key}.txt`,
              urlList
            })
          });
          console.log(`IndexNow HTTP ${response.status}; submitted ${urlList.length} URLs`);
          if (![200, 202].includes(response.status)) {
            console.log(await response.text());
            process.exitCode = 1;
          }
          NODE
