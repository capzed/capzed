name: Deploy AUTOMATET Crypto Deals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatet-crypto-deals-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency security audit
        continue-on-error: true
        shell: bash
        run: |
          audit_status=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          echo "npm audit exit status: $audit_status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/npm-audit.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            console.log('AUDIT_REPORT_UNAVAILABLE: npm did not return valid JSON.');
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities;
          if (counts) {
            console.log('VULNERABILITY_COUNTS ' + JSON.stringify(counts));
          }
          const entries = Object.entries(report.vulnerabilities ?? {});
          if (!entries.length) {
            console.log('NO_DEPENDENCY_VULNERABILITIES_REPORTED');
          }
          for (const [name, item] of entries) {
            console.log('PACKAGE ' + JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable ?? false
            }));
          }
          NODE
      - name: Validate API and smoke-test syntax
        run: npm run check
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list | grep -q "automatet-crypto-deals"; then
            wrangler pages project create automatet-crypto-deals --production-branch main
          fi
      - name: Deploy production branch to isolated Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy . --project-name automatet-crypto-deals --branch main --commit-dirty=true
      - name: Read-only preflight for automatet.com domain migration
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          api="https://api.cloudflare.com/client/v4"
          for project in automatet automatet-crypto-deals; do
            echo "Pages custom domains for project: $project"
            result=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains")
            echo "$result" | jq -r 'if .success then (.result[]? | "DOMAIN " + .name + " STATUS " + (.status // "unknown")) else "READ_FAILED " + ((.errors[0].message // "unknown error")) end' 2>/dev/null || echo "READ_FAILED: response could not be parsed"
          done
          echo "Zone and apex DNS preflight: automatet.com"
          zones=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/zones?name=automatet.com")
          zone_id=$(echo "$zones" | jq -r 'if .success then (.result[0].id // empty) else empty end' 2>/dev/null)
          if [ -n "$zone_id" ]; then
            echo "ZONE_READ_OK"
            dns=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/zones/$zone_id/dns_records?name=automatet.com")
            echo "$dns" | jq -r 'if .success then (.result[]? | "DNS " + .type + " " + .name + " -> " + .content + " PROXIED " + (.proxied|tostring)) else "DNS_READ_FAILED " + ((.errors[0].message // "unknown error")) end' 2>/dev/null || echo "DNS_READ_FAILED: response could not be parsed"
          else
            echo "ZONE_READ_FAILED: token may not have Zone Read permission"
          fi
      - name: Verify production website, public APIs and admin protection
        env:
          SMOKE_BASE_URL: https://automatet-crypto-deals.pages.dev
        run: npm run smoke
